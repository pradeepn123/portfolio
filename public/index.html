<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f9fb" />
    <meta
      name="description"
      content="Pradeepkumar Neginhal — Senior Front-End & Shopify Developer with 8.5+ years building high-performance React, Next.js and Shopify (Liquid & Headless) experiences."
    />
    <meta property="og:title" content="Pradeepkumar Neginhal — Senior Front-End & Shopify Developer" />
    <meta
      property="og:description"
      content="8.5+ years building responsive, conversion-focused Shopify storefronts and React / Next.js web applications."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/pradeep.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/pradeep.jpg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") {
            theme = saved;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <title>Pradeepkumar Neginhal — Front-End & Shopify Developer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
